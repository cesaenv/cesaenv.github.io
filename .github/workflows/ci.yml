name: CI

# Pruebas en cada push y pull request. En main las lanza deploy.yml antes de publicar,
# así no se ejecutan dos veces.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Comprobar tipos y build
        run: npm run build

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Pruebas end-to-end y accesibilidad
        run: npm run test:e2e

      - name: Guardar informe de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
